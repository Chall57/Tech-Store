spring.application.name=ecommerce-backend
app.cartao-chave=${CARD_TOKEN_KEY}
server.address=${SERVER_ADDRESS:127.0.0.1}

# Carrega o .env local ao executar pela raiz do projeto ou pela pasta Backend.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

server.port=${SERVER_PORT:8080}
server.error.include-message=never

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${DB_USERNAME:ecommerce}
spring.datasource.password=${DB_PASSWORD:ecommerce}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.reserva-minutos=${RESERVA_MINUTOS:30}
app.frete.sp=${FRETE_SP:14.90}
app.frete.outros=${FRETE_OUTROS:29.90}
app.frete.internacional=${FRETE_INTERNACIONAL:69.90}
app.frete.item-adicional=${FRETE_ITEM_ADICIONAL:2.00}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=Tech Store
info.app.description=API REST do e-commerce acadêmico de hardware

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
